<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Generate Report</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="capture.css" />
</head>
<body class="capture">
  <header id="capHeader">
    <div class="capTitle">
      <h1>Generate Report</h1>
      <div id="capSite" class="muted">…</div>
    </div>
    <div class="capRef">
      <label for="refField">Reference</label>
      <input id="refField" type="text" spellcheck="false" />
      <span id="refBadge" class="badge"></span>
    </div>
  </header>

  <nav id="tabStrip"></nav>

  <main id="capMain">
    <section id="shotPane">
      <div id="shotBar">
        <span id="shotCount" class="muted"></span>
        <div class="grow"></div>
        <button id="selectAllBtn" class="ghost">Select all</button>
        <button id="selectNoneBtn" class="ghost">Select none</button>
      </div>
      <div id="shotList"></div>
      <div id="shotEmpty" class="empty">No screenshots in this capture.</div>
    </section>

    <aside id="capSide">
      <div class="field">
        <label for="agentSelect">Agent Name</label>
        <select id="agentSelect"></select>
      </div>

      <div class="field">
        <label for="datumField">Datum onderzoek</label>
        <input id="datumField" type="text" spellcheck="false" />
      </div>

      <div class="field">
        <label for="bronField">Bron</label>
        <input id="bronField" type="text" spellcheck="false" />
      </div>

      <div class="field">
        <label>Infractions</label>
        <div id="inbreukPanel" class="checkPanel"></div>
      </div>

      <div class="field grow">
        <label>Gevolg</label>
        <div id="gevolgPanel" class="checkPanel"></div>
        <div id="gevolgSummary" class="muted small"></div>
      </div>

      <div id="capActions">
        <button id="dismissBtn" class="ghost" title="Discard this capture and move to the next">Dismiss</button>
        <button id="generateBtn" class="primary" disabled>Generate Report</button>
      </div>
    </aside>
  </main>

  <div id="domainPrompt" hidden>
    <div class="promptCard">
      <h2>Add new entries for the following domain names?</h2>
      <p class="muted small" id="promptHint"></p>
      <div id="domainList"></div>
      <div class="promptActions">
        <button id="domainNone" class="ghost">Select none</button>
        <div class="grow"></div>
        <button id="domainNo" class="ghost">No</button>
        <button id="domainYes" class="primary">Yes, add selected</button>
      </div>
    </div>
  </div>

  <div id="viewer" hidden>
    <div id="viewerBar">
      <span id="viewerCaption" class="muted"></span>
      <button id="viewerClose" class="ghost">Close</button>
    </div>
    <div id="viewerImageWrap"><img id="viewerImage" alt="" /></div>
  </div>

  <script src="capture.js"></script>
</body>
</html>
