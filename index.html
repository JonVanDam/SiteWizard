<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SiteWizard</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="shell">
    <aside id="sidebar">
      <div id="sideHead">
        <h1>SiteWizard</h1>
        <button id="collapseBtn" class="ghost iconBtn" title="Collapse sidebar">&#9776;</button>
      </div>

      <div id="sideBody">
        <section class="sideSection">
          <div class="sectionTitle">Source</div>
          <button id="loadExcelBtn" class="wide">Load Excel File…</button>
          <div id="excelPath" class="pathLabel">(no file loaded)</div>
          <label class="fieldLabel" for="sheetSelect">Sheet</label>
          <select id="sheetSelect" disabled></select>
        </section>

        <section class="sideSection">
          <div class="sectionTitle">Columns</div>
          <div class="hint">Drag a column name onto a slot below.</div>
          <div id="columnPool" class="pool"><span class="poolEmpty">Load a file to list its columns.</span></div>

          <div class="slots">
            <div class="slot" data-slot="urlCol" data-required="1">
              <span class="slotName">URL</span>
              <span class="slotValue empty">drop here</span>
              <button class="clearSlot ghost iconBtn" title="Clear">&times;</button>
            </div>
            <div class="slot" data-slot="statusCol" data-required="1">
              <span class="slotName">Status</span>
              <span class="slotValue empty">drop here</span>
              <button class="clearSlot ghost iconBtn" title="Clear">&times;</button>
            </div>
            <div class="slot" data-slot="commentCol">
              <span class="slotName">Comment</span>
              <span class="slotValue empty">optional</span>
              <button class="clearSlot ghost iconBtn" title="Clear">&times;</button>
            </div>
            <div class="slot" data-slot="gevolgCol">
              <span class="slotName">Gevolg</span>
              <span class="slotValue empty">optional</span>
              <button class="clearSlot ghost iconBtn" title="Clear">&times;</button>
            </div>
            <div class="slot" data-slot="refCol">
              <span class="slotName">Reference</span>
              <span class="slotValue empty">optional</span>
              <button class="clearSlot ghost iconBtn" title="Clear">&times;</button>
            </div>
          </div>

          <label class="fieldLabel" for="gevolgSheet">Gevolg options sheet</label>
          <select id="gevolgSheet" disabled></select>

          <button id="applyBtn" class="primary wide" disabled>Apply Columns</button>
        </section>

        <section class="sideSection">
          <div class="sectionTitle">Report</div>
          <button id="templateBtn" class="wide">Select Report Template…</button>
          <div id="templatePath" class="pathLabel">(none)</div>
          <button id="outputBtn" class="wide">Select Output Folder…</button>
          <div id="outputPath" class="pathLabel">(none)</div>
        </section>
      </div>
    </aside>

    <div id="content">
      <div id="navbar">
        <button id="sidebarShowBtn" class="ghost iconBtn" title="Show sidebar" hidden>&#9776;</button>
        <button id="backBtn" class="ghost iconBtn" title="Back">&larr;</button>
        <button id="forwardBtn" class="ghost iconBtn" title="Forward">&rarr;</button>
        <button id="reloadBtn" class="ghost iconBtn" title="Reload">&#8635;</button>
        <input id="addressBar" type="text" readonly />
        <span id="currentInfo" class="muted">No entry loaded.</span>
      </div>

      <div id="commentBar">
        <label for="commentField">Comment</label>
        <textarea id="commentField" rows="2" disabled placeholder="(dock a comment column to enable)"></textarea>
      </div>

      <div id="bvContainer"></div>

      <div id="actions">
        <button id="undoBtn" disabled title="Undo last change">&#8630; Undo</button>
        <button id="redoBtn" disabled title="Redo">Redo &#8631;</button>
        <span class="divider"></span>
        <button id="generateBtn" class="primary" disabled>Generate Report</button>
        <button id="deleteReportBtn" class="danger" disabled>Delete Report</button>
        <span class="divider"></span>
        <button id="falsePositiveBtn" disabled>False Positive</button>
        <button id="notSureBtn" disabled>Not Sure</button>
        <span class="divider"></span>
        <button id="prevBtn" disabled title="Previous entry">&larr;</button>
        <button id="skipBtn" disabled>Skip &rarr;</button>
      </div>

      <div id="logWrap">
        <div id="logHead">
          <span>Activity</span>
          <button id="logToggle" class="ghost iconBtn" title="Hide log">&#9662;</button>
        </div>
        <div id="log"></div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
